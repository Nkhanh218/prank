<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bữa tối hôm nay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(to right, #ff758c 0%, #ff7eb3 100%);
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .question-box {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            position: relative;
        }

        .option {
            position: relative;
            width: 60%;
            max-width: 200px;
            cursor: pointer;
            transition: transform 0.3s;
            margin-bottom: 30px;
        }

        .option:hover {
            transform: scale(1.05);
        }

        .option img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .option h3 {
            margin-top: 15px;
            color: #333;
            font-size: 1.5rem;
        }

        #noodles {
            transition: all 0.2s ease-out;
            z-index: 1000; /* Ensure noodles are always on top */
            pointer-events: auto; /* Ensure noodles capture all events */
        }

        .result {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .result p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .result img {
            width: 80%;
            max-width: 300px;
            height: auto;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px 0;
        }

        .btn {
            background-color: #ff758c;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #ff5277;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(8px) rotate(2deg); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Add a subtle hover effect */
        #noodles:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Media queries for responsive design */
        @media (min-width: 768px) {
            .options {
                flex-direction: row;
                justify-content: space-around;
            }

            .option {
                margin-bottom: 0;
            }

            .question-box {
                padding: 40px;
            }

            .result {
                padding: 40px;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const noodlesElement = document.getElementById('noodles');
            const questionBox = document.querySelector('.question-box');
            const resultBox = document.getElementById('result');
            const optionsContainer = document.querySelector('.options');
            let attempts = 0;
            let isMobile = false;

            // Check if device is mobile
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                isMobile = true;
            }

            // Add event listeners for mouse, touch, and click events
            noodlesElement.addEventListener('mouseenter', moveNoodles);

            // Handle touchstart with stopPropagation to prevent touching through to rice
            noodlesElement.addEventListener('touchstart', function(e) {
                e.stopPropagation(); // Prevent touch from reaching elements below
                moveNoodles(e);
            }, { passive: false });

            // Handle click with stopPropagation to prevent clicking through to rice
            noodlesElement.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent click from reaching elements below
                moveNoodles(e);
            });

            // Prevent default touch behavior to avoid scrolling issues
            noodlesElement.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            // Add additional touch event for better mobile experience
            document.addEventListener('touchend', function(e) {
                // Check if touch ended near the noodles element
                const touch = e.changedTouches[0];
                const noodlesRect = noodlesElement.getBoundingClientRect();

                // If touch ended near noodles, move it
                if (Math.abs(touch.clientX - (noodlesRect.left + noodlesRect.width/2)) < 100 &&
                    Math.abs(touch.clientY - (noodlesRect.top + noodlesRect.height/2)) < 100) {
                    moveNoodles();
                }
            }, { passive: true });

            // Add mousemove event to detect when cursor is getting close
            document.addEventListener('mousemove', function(e) {
                const noodlesRect = noodlesElement.getBoundingClientRect();

                // If mouse is getting close to noodles but not directly over it
                if (Math.abs(e.clientX - (noodlesRect.left + noodlesRect.width/2)) < 80 &&
                    Math.abs(e.clientY - (noodlesRect.top + noodlesRect.height/2)) < 80 &&
                    !(e.clientX >= noodlesRect.left && e.clientX <= noodlesRect.right &&
                      e.clientY >= noodlesRect.top && e.clientY <= noodlesRect.bottom)) {
                    moveNoodles();
                }
            }, { passive: true });

            function moveNoodles(event) {
                // Don't prevent default for touchstart to allow scrolling
                if (event && event.type === 'touchstart') {
                    // Just trigger the move without preventing default
                }

                attempts++;

                // Get viewport and element dimensions
                const viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
                const viewportHeight = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
                const noodlesRect = noodlesElement.getBoundingClientRect();

                // Calculate available space for the entire viewport
                const maxX = viewportWidth - noodlesRect.width;
                const maxY = viewportHeight - noodlesRect.height;

                // Ensure we have positive values
                const safeMaxX = Math.max(10, maxX);
                const safeMaxY = Math.max(10, maxY);

                // Calculate new position
                let newX = Math.floor(Math.random() * safeMaxX);
                let newY = Math.floor(Math.random() * safeMaxY);

                // Make sure the new position is different from the current one
                const currentX = parseInt(noodlesElement.style.left) || 0;
                const currentY = parseInt(noodlesElement.style.top) || 0;

                // If too close to current position, adjust
                if (Math.abs(newX - currentX) < 50) {
                    newX = (newX + 100) % safeMaxX;
                }
                if (Math.abs(newY - currentY) < 50) {
                    newY = (newY + 100) % safeMaxY;
                }

                // Apply new position with smoother animation
                noodlesElement.style.position = 'fixed';
                noodlesElement.style.transition = 'left 0.3s ease-out, top 0.3s ease-out';

                // Get rice element position to avoid overlapping
                const riceElement = document.getElementById('rice');
                const riceRect = riceElement ? riceElement.getBoundingClientRect() : null;

                // Check if new position would overlap with rice
                if (riceRect) {
                    // If new position would overlap with rice, adjust it
                    const wouldOverlap = (
                        newX < riceRect.right &&
                        newX + noodlesRect.width > riceRect.left &&
                        newY < riceRect.bottom &&
                        newY + noodlesRect.height > riceRect.top
                    );

                    if (wouldOverlap) {
                        // Move to a different quadrant of the screen
                        if (newX < viewportWidth / 2 && newY < viewportHeight / 2) {
                            // Move to bottom right
                            newX = Math.max(viewportWidth / 2, Math.min(viewportWidth - noodlesRect.width, newX + 200));
                            newY = Math.max(viewportHeight / 2, Math.min(viewportHeight - noodlesRect.height, newY + 200));
                        } else if (newX >= viewportWidth / 2 && newY < viewportHeight / 2) {
                            // Move to bottom left
                            newX = Math.max(0, Math.min(viewportWidth / 2 - noodlesRect.width, newX - 200));
                            newY = Math.max(viewportHeight / 2, Math.min(viewportHeight - noodlesRect.height, newY + 200));
                        } else if (newX < viewportWidth / 2 && newY >= viewportHeight / 2) {
                            // Move to top right
                            newX = Math.max(viewportWidth / 2, Math.min(viewportWidth - noodlesRect.width, newX + 200));
                            newY = Math.max(0, Math.min(viewportHeight / 2 - noodlesRect.height, newY - 200));
                        } else {
                            // Move to top left
                            newX = Math.max(0, Math.min(viewportWidth / 2 - noodlesRect.width, newX - 200));
                            newY = Math.max(0, Math.min(viewportHeight / 2 - noodlesRect.height, newY - 200));
                        }
                    }
                }

                // Small delay to make the animation smoother
                setTimeout(() => {
                    noodlesElement.style.left = newX + 'px';
                    noodlesElement.style.top = newY + 'px';
                }, 10);

                // Add shake effect
                noodlesElement.classList.add('shake');
                setTimeout(() => {
                    noodlesElement.classList.remove('shake');
                }, 500);

                // After several attempts, show a message

            }

            function selectRice() {
                questionBox.style.display = 'none';
                resultBox.style.display = 'block';
            }

            function resetChoice() {
                // Reset positions
                noodlesElement.style.position = 'relative';
                noodlesElement.style.left = '0';
                noodlesElement.style.top = '0';
                noodlesElement.style.transition = 'none';
                noodlesElement.style.zIndex = 'auto';

                // Reset display
                questionBox.style.display = 'block';
                resultBox.style.display = 'none';

                // Scroll back to top to ensure everything is visible
                window.scrollTo(0, 0);

                // Reset attempts
                attempts = 0;
            }

            // Make these functions globally accessible
            window.selectRice = selectRice;
            window.resetChoice = resetChoice;
        });
    </script>
</body>
